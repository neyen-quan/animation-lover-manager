name: Windows · pruebas y aplicación
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --windowed --onedir --name AnimationLoverManager --collect-all faster_whisper --collect-all ctranslate2 --collect-all tokenizers --collect-all sounddevice run.py
      - uses: actions/upload-artifact@v4
        with:
          name: AnimationLoverManager-Windows-desarrollo
          path: dist/AnimationLoverManager/
          retention-days: 14
