name: Windows · pruebas y aplicación
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --windowed --onedir --name AnimationLoverManager --collect-all faster_whisper --collect-all ctranslate2 --collect-all tokenizers --collect-all sounddevice run.py
      - run: python run.py --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: AnimationLoverManager-Windows-desarrollo
          path: dist/AnimationLoverManager/
          retention-days: 14
      - name: Publicar paquete de desarrollo
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "dev-0.1.0-${{ github.run_number }}"
          Compress-Archive -Path dist/AnimationLoverManager -DestinationPath AnimationLoverManager-Windows.zip
          gh release create $tag AnimationLoverManager-Windows.zip --target "${{ github.sha }}" --title "Desarrollo 0.1.0 · compilación ${{ github.run_number }}" --prerelease --notes "Paquete de desarrollo para pruebas. Extraer el ZIP completo y abrir AnimationLoverManager.exe. La interpretación necesita un modelo local de Ollama configurado. El actualizador automático todavía está pendiente."
